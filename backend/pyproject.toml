[project]
name = "intervention-system-backend"
version = "0.1.0"
description = "Generic issue reporting and intervention system (domain-adapter driven)"
readme = "README.md"
authors = [
    { name = "Mohammad Sadique Ejaz", email = "mohammad.ejaz3114@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "python-dotenv==1.2.3",
    "PyJWT==2.13.0",
    "pwdlib[argon2]==0.3.1",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.15.0",
]

[tool.uv]
# The application is run with uvicorn, not installed as a distribution.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py313"
# Migration scripts are generated by Alembic; reformatting them would only make
# the next autogenerate noisier.
extend-exclude = ["alembic"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade, security.
select = ["E", "F", "I", "B", "C4", "UP", "S"]
ignore = [
    "B008",  # FastAPI dependencies are declared as call defaults by design.
]

[tool.ruff.lint.per-file-ignores]
# "bearer" is the OAuth2 token type, and the JWT default is a documented
# development placeholder, not a credential.
"app/auth/schemas.py" = ["S105"]
"app/core/config.py" = ["S105"]
# Tests assert on values and use fixture passwords; both are the point.
"tests/*" = ["S101", "S105", "S106"]
# Seeded development credentials are documented, not secrets.
"scripts/seed.py" = ["S105", "S106"]
